# Builds the Android app on every push and offers the APK as a download on the run's page.
name: Android app
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'android/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: icarus-dispatch-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
